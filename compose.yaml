services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    command: ["--ngram-token-size=2"]

  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  model-mock:
    build:
      context: ./model-mock
    environment:
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-16}
      CAMPUSCLAW_TEST_TRACE: ${CAMPUSCLAW_TEST_TRACE:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mcp-demo:
    build:
      context: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      CAMPUSCLAW_TEST_TRACE: ${CAMPUSCLAW_TEST_TRACE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      UPLOAD_DIR: /data/uploads
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://model-mock:8081}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-campusclaw-mock-embedding}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-16}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-${GLM_BASE_URL:-http://model-mock:8081}}
      CHAT_API_KEY: ${CHAT_API_KEY:-${GLM_API_KEY:-}}
      CHAT_MODEL: ${CHAT_MODEL:-${GLM_MODEL:-campusclaw-mock-chat}}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.35}
      KEYWORD_MIN_SCORE: ${KEYWORD_MIN_SCORE:-0.01}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      CAMPUSCLAW_TEST_TRACE: ${CAMPUSCLAW_TEST_TRACE:-false}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      model-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
  qdrant_data:
