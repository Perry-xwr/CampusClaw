openapi: 3.0.3
info:
  title: CampusClaw API
  version: 1.0.0
  description: >-
    Based on the current Go handlers. All class-scoped operations derive class_id
    from the authenticated Bearer token; supplied class_id values are ignored.
servers:
  - url: /
tags:
  - name: Health
  - name: Authentication
  - name: Knowledge
  - name: Prompts and skills
  - name: Sessions
  - name: Materials
  - name: MCP tools
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and MySQL availability
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/login:
    post:
      tags: [Authentication]
      summary: Log in and create a Bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: student_a1, password: '***' }
      responses:
        '200':
          description: Token and server-resolved user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                token: opaque-token
                user: { id: 2, username: student_a1, role: student, class_id: 1, class_name: A 班 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid username or password }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session token
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked; no response body }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Authentication]
      summary: Return the user resolved from the current token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user identity and class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 2, username: student_a1, role: student, class_id: 1, class_name: A 班 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/materials:
    get:
      tags: [Materials]
      summary: List materials in the current class
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Materials for the token's class
          content:
            application/json:
              schema:
                type: object
                required: [materials]
                properties:
                  materials: { type: array, items: { $ref: '#/components/schemas/Material' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Materials]
      summary: Upload a UTF-8 TXT or Markdown material (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200, description: Optional; defaults to filename without extension }
      responses:
        '201':
          description: Material and knowledge entry stored; indexing is attempted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
              example: { id: 31, title: 实验安全, index_status: ready }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Upload exceeds configured size limit }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/materials/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Materials]
      summary: Get metadata for a material in the current class
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Material metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Materials]
      summary: Delete a material from the current class (teacher only)
      description: Marks the material as pending before removing its Qdrant points, uploaded file, and database records. Retry the same request after a 503; pending records remain visible to teachers only. Historical chat messages and citation snapshots are retained.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Material, source entry, chunks, file, and matching vector points deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Deletion is pending because an external cleanup step failed; retry this request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'material deletion is pending; retry the request' }
  /api/materials/{id}/file:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Materials]
      summary: Download a material in the current class
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: UTF-8 material file
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/materials/{id}/reindex:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      tags: [Materials]
      summary: Rebuild material chunks and vector index (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChunkOptions' }
            example: { strategy: custom, max_length: 600, overlap_percent: 10, separator: blank-line }
      responses:
        '200':
          description: Index rebuilt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexResult' }
              example: { material_id: 31, index_status: ready }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/knowledge/search:
    post:
      tags: [Knowledge]
      summary: Search knowledge chunks in the current class
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example: { query: 实验前需要做什么准备？, mode: hybrid }
      responses:
        '200':
          description: Ordered search hits; message is present when no hits are found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/ask:
    post:
      tags: [Knowledge]
      summary: Non-streaming evidence-grounded ask compatibility endpoint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
            example:
              messages: [{ role: user, content: 实验前需要做什么准备？ }]
      responses:
        '200':
          description: Answer and ordered citations; with no hits returns the fixed no-results answer, empty citations and does not call Chat Model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/prompts:
    get:
      tags: [Prompts and skills]
      summary: List prompts for the current class (students see active prompts only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prompt list
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts: { type: array, items: { $ref: '#/components/schemas/Prompt' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Prompts and skills]
      summary: Create a prompt for the current class (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptRequest' }
            example: { name: 课堂引导, content: 请依据班级资料逐步引导学生思考。, is_active: true }
      responses:
        '201':
          description: Prompt created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prompt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/prompts/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      tags: [Prompts and skills]
      summary: Update a prompt in the current class (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptRequest' }
            example: { name: 课堂引导, content: 回答需依据检索材料并保留引用。, is_active: true }
      responses:
        '200':
          description: Prompt updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prompt' }
        '400':
          description: Invalid prompt fields or attempting to deactivate the last active prompt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/skills:
    get:
      tags: [Prompts and skills]
      summary: List skills for the current class (students see active skills only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Skill list
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Prompts and skills]
      summary: Create a skill for the current class (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillRequest' }
            example: { slug: hint-only, name: 解题引导, instructions: 只提出下一步思考提示，不直接给出最终答案。, is_active: true }
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/skills/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      tags: [Prompts and skills]
      summary: Update a skill in the current class (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillRequest' }
            example: { slug: hint-only, name: 解题引导, instructions: 只提问引导，不输出最终答案。, is_active: true }
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400':
          description: Invalid skill fields or reserved guided-solution skill modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sessions:
    get:
      tags: [Sessions]
      summary: List sessions belonging to the current user and class
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/ChatSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sessions]
      summary: Create a learning session for the current user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
            example: { title: 实验准备, prompt_id: 1, skill_id: 1, class_id: 999 }
      responses:
        '201':
          description: Session created with token-derived owner and class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/sessions/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Sessions]
      summary: Get ordered messages for a session owned by the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Messages and their persisted citations
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sessions]
      summary: Send a user message and stream evidence-grounded answer events
      description: >-
        Returns SSE. Streams emit meta, then sources, one or more delta events,
        then done. With no evidence, emits meta with an empty tool_calls array,
        sources with an empty citations array,
        a delta containing the fixed no-results answer, and done without Chat Model
        invocation. A model/storage failure after stream starts emits error and no
        completed assistant message is stored.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
            example: { content: 实验前需要做什么准备？, class_id: 999 }
      responses:
        '200':
          description: UTF-8 Server-Sent Events; events are flushed as produced
          content:
            text/event-stream:
              schema: { type: string, description: 'SSE frames: event: <name> followed by data: <JSON> and a blank line' }
              example: |-
                event: meta
                data: {"tool_calls":[{"ref":"unit_convert@mcp-demo","status":"ok"}]}

                event: sources
                data: {"citations":[{"material_id":1,"material_title":"实验安全","knowledge_entry_id":1,"chunk_id":3,"chunk_index":0,"start_offset":0,"end_offset":120,"excerpt":"实验前应完成安全培训。","material_url":"/api/materials/1/file","rank":1,"score":0.02}]}

                event: delta
                data: {"text":"请先回忆实验前的安全要求。[1]"}

                event: done
                data: {"message_id":12,"answer":"请先回忆实验前的安全要求。[1]"}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
      x-sse-events:
        meta: { $ref: '#/components/schemas/ToolMetaEvent' }
        sources: { $ref: '#/components/schemas/SourcesEvent' }
        delta: { $ref: '#/components/schemas/DeltaEvent' }
        done: { $ref: '#/components/schemas/DoneEvent' }
        error: { $ref: '#/components/schemas/StreamErrorEvent' }
  /api/mcp/servers:
    get:
      tags: [MCP tools]
      summary: List MCP servers registered for the current class (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Server configuration; token is represented only by has_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers: { type: array, items: { $ref: '#/components/schemas/MCPServer' } }
              example: { servers: [{ id: 1, name: mcp-demo, base_url: 'http://mcp-demo:8090', connected: false, has_token: true, created_at: '2026-01-01T00:00:00Z' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [MCP tools]
      summary: Register an allowlisted MCP server for the current class (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServerRequest' }
            example: { name: mcp-demo, base_url: 'http://mcp-demo:8090' }
      responses:
        '201':
          description: Registered server; no credential is accepted or returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/mcp/servers/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      tags: [MCP tools]
      summary: Rename a disconnected MCP server (teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServerRequest' }
            example: { name: mcp-demo, base_url: 'http://mcp-demo:8090' }
      responses:
        '200':
          description: Updated server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [MCP tools]
      summary: Delete a disconnected server with no skill bindings (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Server deleted; no response body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/mcp/servers/{id}/connect:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      tags: [MCP tools]
      summary: Initialize MCP and discover/cache tools (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Successful connection and tool discovery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectResponse' }
              example: { server_id: 1, connected: true, tools_discovered: 2, has_token: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/mcp/servers/{id}/disconnect:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      tags: [MCP tools]
      summary: Disconnect and clear the discovered tool cache (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Server disconnected and cache cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id: { type: integer, format: int64 }
                  connected: { type: boolean, example: false }
                  tools_cleared: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mcp/servers/{id}/tools:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [MCP tools]
      summary: List discovered tools for a connected server (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current discovered tool schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools: { type: array, items: { $ref: '#/components/schemas/MCPTool' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mcp/tool-calls:
    get:
      tags: [MCP tools]
      summary: List the latest 100 MCP call audit records in the current class (teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit metadata without tool arguments, outputs, or credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool_calls: { type: array, items: { $ref: '#/components/schemas/MCPAudit' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mcp:
    servers:
      - url: http://mcp-demo:8090
        description: Compose network only; this service has no published host port
    post:
      tags: [MCP tools]
      summary: MCP JSON-RPC 2.0 endpoint (internal service)
      description: >-
        Authenticate with the separate server-to-server MCP_AUTH_TOKEN, not a
        browser session token. Supports initialize, tools/list and tools/call.
        The same internal service exposes unauthenticated GET /health, which
        returns 503 until MCP_AUTH_TOKEN is configured. Tool call arguments are
        validated by the MCP server; errors for valid JSON-RPC requests use the
        JSON-RPC error object with HTTP 200.
      security: [{ mcpBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPJSONRPCRequest' }
            examples:
              initialize:
                value: { jsonrpc: '2.0', id: 1, method: initialize, params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: classroom-host, version: '1.0' } } }
              listTools:
                value: { jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} }
              callTool:
                value: { jsonrpc: '2.0', id: 3, method: 'tools/call', params: { name: unit_convert, arguments: { value: 1.5, from_unit: km, to_unit: m } } }
      responses:
        '200':
          description: JSON-RPC result or JSON-RPC error for a valid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPJSONRPCResponse' }
              example: { jsonrpc: '2.0', id: 3, result: { content: [{ type: text, text: '1.5 km = 1500 m' }], isError: false } }
        '400': { description: Invalid JSON or request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing or incorrect MCP Bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: MCP_AUTH_TOKEN is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque Token
    mcpBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Server-side MCP service token
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Positive numeric resource identifier
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid request body or parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid request }
    Unauthorized:
      description: Missing, invalid, expired or revoked Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: authentication required }
    Forbidden:
      description: Authenticated user lacks the required teacher role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: teacher role required }
    Conflict:
      description: Duplicate or state-conflicting resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: could not register MCP server }
    InternalError:
      description: Internal server or database error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: internal server error }
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: database unavailable }
    DependencyUnavailable:
      description: A required retrieval, model or database dependency is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: vector retrieval unavailable }
    NotFound:
      description: Resource does not exist or is not accessible in the current class/user scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: resource not found }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    User:
      type: object
      required: [id, username, role, class_id, class_name]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [teacher, student] }
        class_id: { type: integer, format: int64 }
        class_name: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 1 }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Opaque bearer token; store securely and do not log it }
        user: { $ref: '#/components/schemas/User' }
    Material:
      type: object
      required: [id, title, original_filename, uploader, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        original_filename: { type: string }
        uploader: { type: string }
        created_at: { type: string, format: date-time }
        deletion_pending: { type: boolean, description: Teacher-visible retry status when external cleanup is incomplete }
    UploadResult:
      type: object
      required: [id, title, index_status]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        index_status: { type: string, enum: [ready, failed] }
    ChunkOptions:
      type: object
      properties:
        strategy: { type: string, enum: [auto, custom, hierarchy], default: auto }
        max_length: { type: integer, minimum: 100, maximum: 2000 }
        overlap_percent: { type: integer, minimum: 0, maximum: 50 }
        separator: { type: string, enum: [newline, blank-line, period] }
        remove_urls_emails: { type: boolean }
        collapse_whitespace: { type: boolean }
        class_id: { type: integer, description: Ignored; class is resolved from Bearer token }
    ReindexResult:
      type: object
      required: [material_id, index_status]
      properties:
        material_id: { type: integer, format: int64 }
        index_status: { type: string, enum: [ready] }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        mode: { type: string, enum: [keyword, vector, hybrid], default: hybrid }
        class_id: { type: integer, description: Ignored; class is resolved from Bearer token }
    SearchHit:
      type: object
      required: [material_id, material_title, knowledge_entry_id, chunk_id, chunk_index, start_offset, end_offset, excerpt, material_url, rank, score]
      properties:
        material_id: { type: integer, format: int64 }
        material_title: { type: string }
        knowledge_entry_id: { type: integer, format: int64 }
        chunk_id: { type: integer, format: int64 }
        chunk_index: { type: integer }
        start_offset: { type: integer }
        end_offset: { type: integer }
        excerpt: { type: string }
        material_url: { type: string }
        rank: { type: integer }
        score: { type: number, format: double }
        keyword_rank: { type: integer }
        vector_rank: { type: integer }
    SearchResponse:
      type: object
      required: [query, mode, hits]
      properties:
        query: { type: string }
        mode: { type: string, enum: [keyword, vector, hybrid] }
        hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        message: { type: string, description: Present when hits is empty }
    AskRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string }
              content: { type: string }
          description: Latest message with role user supplies the question
        class_id: { type: integer, description: Ignored; class is resolved from Bearer token }
    AskResponse:
      type: object
      required: [answer, citations]
      properties:
        answer: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
    Prompt:
      type: object
      required: [id, name, content, is_active, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        content: { type: string }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time }
    PromptRequest:
      type: object
      required: [name, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, minLength: 1, maxLength: 20000 }
        is_active: { type: boolean, default: true }
    Skill:
      type: object
      required: [id, slug, name, instructions, tools, is_active, updated_at]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        instructions: { type: string }
        tools: { type: array, items: { $ref: '#/components/schemas/MCPToolBinding' } }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time }
    SkillRequest:
      type: object
      required: [slug, name, instructions]
      properties:
        slug: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        instructions: { type: string, minLength: 1, maxLength: 20000 }
        tools: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/MCPToolBinding' } }
        is_active: { type: boolean, default: true }
    CreateSessionRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200, default: 新对话 }
        prompt_id: { type: integer, format: int64, nullable: true }
        skill_id: { type: integer, format: int64, nullable: true }
        class_id: { type: integer, description: Ignored; class is resolved from Bearer token }
    ChatSession:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        prompt_id: { type: integer, format: int64, nullable: true }
        skill_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
        class_id: { type: integer, description: Ignored; class is resolved from Bearer token }
    ChatMessage:
      type: object
      required: [id, role, content, citations, created_at]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/ToolCallStatus' } }
        created_at: { type: string, format: date-time }
    SourcesEvent:
      type: object
      required: [citations]
      properties:
        citations: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
    DeltaEvent:
      type: object
      required: [text]
      properties:
        text: { type: string }
    DoneEvent:
      type: object
      required: [message_id, answer]
      properties:
        message_id: { type: integer, format: int64 }
        answer: { type: string }
    StreamErrorEvent:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MCPServerRequest:
      type: object
      required: [name, base_url]
      properties:
        name: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$' }
        base_url: { type: string, enum: ['http://mcp-demo:8090'] }
    MCPJSONRPCRequest:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        method: { type: string, enum: [initialize, 'tools/list', 'tools/call'] }
        params: { type: object, additionalProperties: true }
    MCPJSONRPCResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
    MCPServer:
      type: object
      required: [id, name, base_url, connected, has_token, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        base_url: { type: string }
        connected: { type: boolean }
        has_token: { type: boolean, description: Never contains token value }
        created_at: { type: string, format: date-time }
    MCPConnectResponse:
      type: object
      required: [server_id, connected, tools_discovered, has_token]
      properties:
        server_id: { type: integer, format: int64 }
        connected: { type: boolean }
        tools_discovered: { type: integer }
        has_token: { type: boolean }
    MCPTool:
      type: object
      required: [name, description, input_schema, discovered_at]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object }
        discovered_at: { type: string, format: date-time }
    MCPToolBinding:
      type: object
      required: [ref]
      properties:
        ref: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,119}@[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$', example: unit_convert@mcp-demo }
    ToolCallStatus:
      type: object
      required: [ref, status]
      properties:
        ref: { type: string }
        status: { type: string, enum: [ok, denied, error] }
    ToolMetaEvent:
      type: object
      required: [tool_calls]
      properties:
        tool_calls: { type: array, items: { $ref: '#/components/schemas/ToolCallStatus' } }
    MCPAudit:
      type: object
      required: [id, server_name, tool_name, username, session_id, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        server_name: { type: string }
        tool_name: { type: string }
        username: { type: string }
        session_id: { type: integer, format: int64 }
        message_id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, ok, denied, error] }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
